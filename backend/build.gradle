plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.quickfixhub'
version = '0.0.1-SNAPSHOT'
description = 'QuickFixHub backend API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Spring Boot has no built-in .env support (that's Docker Compose's doing, not the JVM's) -
// without this, `.env` sits there unused and DB_URL/etc. silently fall back to the defaults
// baked into application.yml. Loads .env into bootRun's and test's environment so the workflow
// the README documents (`cp .env.example .env` then `./gradlew bootRun`) actually works.
//
// Only fills in keys NOT already present in the environment - an already-exported shell
// variable (e.g. `DB_URL=... ./gradlew bootRun`, used for one-off verification against a
// different database) must win over .env, matching every other dotenv tool's convention.
// Getting this backwards once silently redirected a "throwaway" verification run at the real
// dev database instead - additive Flyway migrations made it harmless, but it defeated the
// point of an isolated check.
def envFile = rootProject.file('.env')
if (envFile.exists()) {
	def envVars = [:]
	envFile.eachLine { line ->
		def trimmed = line.trim()
		if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
			def (key, value) = trimmed.split('=', 2)
			def trimmedKey = key.trim()
			if (System.getenv(trimmedKey) == null) {
				envVars[trimmedKey] = value.trim()
			}
		}
	}
	tasks.named('bootRun') { environment(envVars) }
	tasks.named('test') { environment(envVars) }
}
