spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickfixhub}
    username: ${DB_USERNAME:quickfixhub}
    password: ${DB_PASSWORD:changeme}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Defaults target the local Mailpit container (docker-compose.yml). For real delivery (Gmail,
  # SES, Postmark, ...) set SMTP_HOST/PORT/USERNAME/PASSWORD and flip SMTP_AUTH + SMTP_STARTTLS
  # to true - see backend/.env.example for a ready-to-fill Gmail block.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
      # 10s is comfortable for both a localhost sink and a real provider; the send is already
      # off the request thread (@Async), this just stops a dead host hanging that worker forever.
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-value-min-32-chars}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  login-rate-limit:
    max-attempts: 5
    window-minutes: 15
  mail:
    from: ${MAIL_FROM:no-reply@quickfixhub.local}
    from-name: ${MAIL_FROM_NAME:QuickFixHub}
  password-reset:
    code-ttl-minutes: ${PASSWORD_RESET_CODE_TTL_MINUTES:15}
    max-verify-attempts: 5
    # Per-email cap on how often a reset code can be requested.
    max-requests-per-window: 3
    request-window-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
